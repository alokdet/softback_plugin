<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Inter, Arial, sans-serif;
      background: #181818;
      color: #ffffff;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .description {
      margin-bottom: 18px;
      color: #aaaaaa;
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #18a0fb;
      color: white;
    }

    button:hover {
      background: #0d8de0;
    }

    .secondary {
      background: #303030;
      margin-top: 8px;
    }

    .secondary:hover {
      background: #3b3b3b;
    }

    #status {
      margin: 14px 0 8px;
      font-size: 12px;
      color: #aaaaaa;
    }

    textarea {
      width: 100%;
      height: 230px;
      resize: vertical;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 10px;
      background: #101010;
      color: #dddddd;
      font-family: Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      outline: none;
    }

    textarea:focus {
      border-color: #18a0fb;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .buttons button {
      flex: 1;
    }
  </style>

</head>

<body>

  <h2>SoftLauncher Exporter</h2>

  <div class="description">
    Select exactly one Frame in Figma and export it as
    SoftLauncher Design Format (SLDF).
  </div>

  <button id="export">
    Export SLDF
  </button>

  <div id="status">
    Waiting for a Frame...
  </div>

  <textarea
    id="output"
    placeholder="Generated SLDF JSON will appear here..."
    readonly
  ></textarea>

  <div class="buttons">

```
<button
  id="copy"
  class="secondary"
>
  Copy JSON
</button>

<button
  id="download"
  class="secondary"
>
  Download
</button>
```

  </div>

  <script>

    const exportButton = document.getElementById("export");
    const copyButton = document.getElementById("copy");
    const downloadButton = document.getElementById("download");

    const status = document.getElementById("status");
    const output = document.getElementById("output");


    // Request export from Figma
    exportButton.onclick = () => {

      status.textContent = "Exporting...";

      parent.postMessage(
        {
          pluginMessage: {
            type: "export"
          }
        },
        "*"
      );

    };


    // Receive messages from code.ts
    window.onmessage = (event) => {

      const msg = event.data.pluginMessage;

      if (!msg) {
        return;
      }


      // Export successful
      if (msg.type === "export-result") {

        output.value = msg.data;

        status.textContent =
          "SLDF exported successfully.";

      }


      // Export error
      if (msg.type === "error") {

        status.textContent =
          "Error: " + msg.message;

        output.value = "";

      }

    };


    // Copy JSON
    copyButton.onclick = async () => {

      if (!output.value) {

        status.textContent =
          "Nothing to copy.";

        return;

      }

      try {

        await navigator.clipboard.writeText(
          output.value
        );

        status.textContent =
          "JSON copied to clipboard.";

      } catch (error) {

        status.textContent =
          "Could not copy JSON.";

      }

    };


    // Download JSON
    downloadButton.onclick = () => {

      if (!output.value) {

        status.textContent =
          "Nothing to download.";

        return;

      }

      const blob = new Blob(
        [output.value],
        {
          type: "application/json"
        }
      );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "softlauncher-scene.sldf.json";

      link.click();

      URL.revokeObjectURL(url);

      status.textContent =
        "SLDF file downloaded.";

    };

  </script>

</body>
</html>
